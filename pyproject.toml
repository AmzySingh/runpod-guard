[project]
name = "runpod-guard"
version = "0.1.0"
description = "Run bounded, disposable Runpod jobs with defense-in-depth teardown"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AmzySingh"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runpod-guard = "runpod_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
